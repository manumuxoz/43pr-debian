# Each target: input template -> output file. Optional `reload` is an argv list
# that runs once after ALL targets were written successfully.

[kitty]
input  = "~/.config/43pr/templates/kitty.conf"
output = "~/.config/kitty/matugen.conf"
reload = ["pkill", "-USR1", "-x", "kitty"]
[rofi]
input  = "~/.config/43pr/templates/rofi-colors.rasi"
output = "~/.config/rofi/colors.rasi"
[waybar]
input  = "~/.config/43pr/templates/waybar-colors.css"
output = "~/.config/waybar/colors.css"
reload = ["pkill", "-SIGUSR2", "waybar"]
[hyprlock]
input  = "~/.config/43pr/templates/hyprlock-colors.conf"
output = "~/.config/hypr/hyprlock-colors.conf"
[wlogout]
input  = "~/.config/43pr/templates/wlogout-colors.css"
output = "~/.config/wlogout/colors.css"
# Adaptacion Debian: [gtk3]/[gtk4] desactivados a proposito.
# El tema GTK global (~/.config/gtk-3.0 y gtk-4.0) se deja intacto para no
# afectar a GNOME; dentro de Hyprland las apps GTK usan "Adwaita:dark"
# mediante la variable de entorno GTK_THEME (ver hypr/hyprland.lua).
[quickshell]
input  = "~/.config/43pr/templates/quickshell-theme.json"
output = "~/.cache/43pr/quickshell-theme.json"
[wofi]
input  = "~/.config/43pr/templates/wofi-style.css"
output = "~/.config/wofi/style.css"
