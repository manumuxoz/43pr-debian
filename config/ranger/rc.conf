# ~/.config/ranger/rc.conf
# Overrides sobre la configuración del sistema de Ranger 1.9.4.
# Mantener este archivo pequeño y revisable.

# --- Previsualizaciones ---
set preview_files true
set preview_directories true
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh
set preview_images true
set preview_images_method kitty
set preview_max_size 26214400

# --- Borrado seguro ---
# `dT` usa :trash y la regla `gio trash` de rifle.conf (papelera de Thunar).
# `dD` sigue siendo borrado permanente: se pide confirmación siempre.
set confirm_on_delete always
map <F8> trash

# --- Navegación y apariencia ---
set viewmode miller
set sort natural
set sort_directories_first true
set show_hidden false
set draw_borders none

# --- Integración con Thunar ---
# gN: abrir el directorio actual en una ventana nueva de Thunar.
# gF: abrir Thunar y seleccionar el archivo resaltado.
map gN shell -f thunar --window %d
map gF shell -f thunar --window %d/%f
