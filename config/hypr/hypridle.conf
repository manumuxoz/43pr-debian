# ────────────────────────────────────────────────────────────────
# hypridle.conf — gestión de inactividad de Hyprland
#
# IMPORTANTE: el bloqueo automático está DESACTIVADO a pedido del
# usuario (bloquear nunca). Por eso no hay lock_cmd, ni listener de
# bloqueo, ni bloqueo al suspender. El bloqueo MANUAL sigue
# funcionando con SUPER+Tab (lanza hyprlock directamente).
#
# Los "timeout" son en segundos: ajustalos a gusto.
# ────────────────────────────────────────────────────────────────

general {
    # Sin lock_cmd ni before_sleep_cmd: nunca bloquear la pantalla.

    # Encender la pantalla al despertar (evita tener que pulsar dos veces)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# (Nota: no hay listener de bloqueo: el bloqueo automático quedó desactivado)

# 5 minutos 30 s sin actividad → apagar la pantalla
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 minutos sin actividad → suspender, SOLO si está a batería
# (si está enchufado no suspende)
listener {
    timeout = 900
    on-timeout = $HOME/.config/hypr/scripts/suspend-if-on-battery.sh
}
