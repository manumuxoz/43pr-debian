# hyprlogin.conf — Pantalla de login de Debian (estilo hyprlock / 43pr)
# Se instala en /etc/hyprlogin/hyprlogin.conf
# Para actualizar colores/fondo tras cambiar el tema:  sudo sincronizar-login

$font = Roboto Mono
source = /etc/hyprlogin/colors.conf

general {
    hide_cursor = false
    immediate_render = true
    exit_command = hyprctl dispatch exit || pkill -x Hyprland
    fail_timeout = 4000
    debug_mode = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/hyprlogin/wallpaper.jpg
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = $lock_outline
    check_color = $lock_check
    fail_color = $lock_fail

    font_color = $lock_font
    fade_on_empty = false
    rounding = 25

    font_family = $font
    placeholder_text = Contraseña
    placeholder_text_username = Usuario
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_size = 0.2
    dots_spacing = 0.3

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 60
    font_family = $font
    color = $lock_time
    position = 0, -130
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 16
    font_family = $font
    color = $lock_date
    position = 0, -250
    halign = center
    valign = top
}

# Indicador de layout quitado a peticion (descomenta el bloque para recuperarlo).
# label {
#     monitor =
#     text = $LAYOUT[es]
#     font_size = 14
#     font_family = $font
#     color = $lock_layout
#     position = 0, -70
#     halign = center
#     valign = center
# }

# SESIÓN (solo aparece en el greeter)
label {
    monitor =
    text = $GREETD_SESSION
    font_size = 14
    color = $lock_layout
    font_family = $font
    onclick = hyprlogin:session_next
    position = 0, 30
    halign = center
    valign = bottom
}

sessions {
    # IMPORTANTE: cambia TU_USUARIO por tu nombre de usuario antes de copiar
    # este archivo a /etc/hyprlogin/hyprlogin.conf
    default_user = TU_USUARIO
    default_session = hyprland.desktop
}
