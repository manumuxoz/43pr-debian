# Adaptacion Debian: awww no está en Debian; el shim ~/.local/bin/awww prefiere
# swaybg (layer-shell, estable) y deja hyprpaper solo como último recurso
# (hyprpaper 0.8.4 segfaultea al re-aplicar wallpaper). El shim lo controla por
# IPC (hyprctl hyprpaper ...) si llega a usarlo.
splash = false
ipc = true
